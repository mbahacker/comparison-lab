name: Validate Alhena Research Lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix worker --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: docker build -t comparison-lab-web .
      - run: docker build -f worker/Dockerfile -t comparison-lab-worker .
      - run: docker build -f judge/Dockerfile -t comparison-lab-judge .
      - name: Validate production Compose and HTTPS configuration
        env:
          APP_URL: https://evals.alhena.ai
          MAIL_FROM: Alhena Research Lab <reports@alhena.ai>
          MAIL_TRANSPORT: sendgrid
          SENDGRID_API_KEY: ci-placeholder-not-a-real-key
          WORKER_SECRET: ci-placeholder-worker-secret-at-least-32-characters
          MODEL_PROVIDER: openai
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
          JUDGE_MODEL: ci-placeholder-model
          AUDITOR_MODEL: ci-placeholder-model
        run: |
          docker compose -f compose.yml -f compose.https.yml --profile worker config --quiet
          docker compose -f compose.yml -f compose.https.yml -f compose.shared.yml --profile worker config --quiet
          docker compose -f compose.yml -f compose.https.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate web-only configuration without worker or model credentials
        env:
          APP_URL: https://evals.alhena.ai
          MAIL_FROM: Alhena Research Lab <reports@alhena.ai>
          MAIL_TRANSPORT: sendgrid
        run: |
          unset COMPOSE_PROFILES WORKER_SECRET WORKER_API_KEY MODEL_PROVIDER OPENAI_API_KEY ANTHROPIC_API_KEY OPENAI_BASE_URL ANTHROPIC_BASE_URL JUDGE_MODEL AUDITOR_MODEL SENDGRID_API_KEY RESEND_API_KEY
          docker compose --env-file /dev/null -f compose.yml -f compose.https.yml config --quiet
          docker compose --env-file /dev/null -f compose.yml -f compose.https.yml -f compose.shared.yml config --quiet
          services=$(docker compose --env-file /dev/null -f compose.yml -f compose.https.yml -f compose.shared.yml config --services)
          test "$(printf '%s\n' "$services" | sort)" = "$(printf '%s\n' caddy mailer web)"
      - name: Validate isolated CLI judge configuration without subscription credentials
        env:
          APP_URL: https://evals.alhena.ai
          MAIL_FROM: Alhena Research Lab <reports@alhena.ai>
          WORKER_SECRET: ci-placeholder-worker-secret-at-least-32-characters
          JUDGE_SERVICE_SECRET: ci-placeholder-judge-secret-at-least-32-characters
          JUDGE_MODEL: ci-placeholder-model
          AUDITOR_MODEL: ci-placeholder-model
          CLAUDE_TOKEN_FILE: /dev/null
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          docker compose --env-file /dev/null -f compose.yml -f compose.https.yml -f compose.shared.yml -f compose.claude.yml --profile worker config --quiet
