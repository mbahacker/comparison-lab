# For a dedicated host without an existing reverse proxy:
# docker compose -f compose.yml -f compose.https.yml up -d --build
services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set the public HTTPS URL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
volumes:
  caddy-data:
  caddy-config:
